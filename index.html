<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="113 rébus visuels sur la gestion de projet et de portefeuille, avec un mode quiz chronométré pour animer vos ateliers.">
<meta property="og:title" content="Dingbats du chef de projet">
<meta property="og:description" content="113 rébus visuels sur la gestion de projet, avec un mode quiz pour les ateliers.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232547D0'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='900' font-size='20' fill='white' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dingbats du chef de projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: planning-paper header, sticky filter bar, square puzzle tiles in a grid; quiz overlay for workshops. Duotone = graphite ink + cobalt. */
:root{
  --bg:#E9ECE6; --surface:#F6F7F3; --tile:#FCFCFA; --ink:#141C2B; --ink-2:#4A5466; --mute:#98A0AD; --line:#D2D7CE;
  --acc:#2547D0; --acc-soft:#D9E0F8; --shade:#C2C9D5;
  --ok:#1E8F4E; --bad:#D1352B; --ice:#D6ECF5; --ice-hi:rgba(255,255,255,.65); --ice-edge:#A9D1E2; --ice-ink:#24607B;
  --water:#7FB4D8; --water-ink:#2B78B5; --wood:#C08A55; --wood-ink:#3A2410; --wine:#8E2A45;
  --f-puz:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#161B24; --tile:#1B212C; --ink:#EDF0F5; --ink-2:#AAB2C0; --mute:#6D7687; --line:#2A3240;
  --acc:#86A2FF; --acc-soft:#26315A; --shade:#3A4354;
  --ok:#4FCB86; --bad:#FF6A5F; --ice:#1D3B49; --ice-hi:rgba(255,255,255,.08); --ice-edge:#2E5A6C; --ice-ink:#A6DBF0;
  --water:#2C5F86; --water-ink:#7FC0F2; --wood:#7A5432; --wood-ink:#F6E3CC; --wine:#C9587A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#161B24; --tile:#1B212C; --ink:#EDF0F5; --ink-2:#AAB2C0; --mute:#6D7687; --line:#2A3240;
  --acc:#86A2FF; --acc-soft:#26315A; --shade:#3A4354;
  --ok:#4FCB86; --bad:#FF6A5F; --ice:#1D3B49; --ice-hi:rgba(255,255,255,.08); --ice-edge:#2E5A6C; --ice-ink:#A6DBF0;
  --water:#2C5F86; --water-ink:#7FC0F2; --wood:#7A5432; --wood-ink:#F6E3CC; --wine:#C9587A; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Header on planning paper */
.hd{border-bottom:1px solid var(--line);
  background:
   repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px),
   var(--surface)}
.hd .wrap{padding-block:40px 30px;display:grid;gap:14px}
.eyebrow{margin:0;font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:900 clamp(40px,8vw,84px)/.92 var(--f-puz);font-stretch:118%;letter-spacing:-.02em;text-wrap:balance}
h1 .flip{display:inline-block;transform:scaleX(-1);color:var(--acc)}
.lede{margin:0;max-width:60ch;color:var(--ink-2);font-size:16px}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-block:10px 4px}
.btn-hero{display:inline-flex;align-items:center;gap:16px;border:2px solid var(--ink);background:var(--acc);color:var(--tile);border-radius:14px;padding:16px 28px 16px 20px;font:800 clamp(22px,3.4vw,30px)/1.05 var(--f-puz);font-stretch:110%;box-shadow:6px 6px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-align:left;max-width:100%}
.btn-hero:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn-hero:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn-hero .lbl{display:flex;flex-direction:column;gap:6px}
.btn-hero small{font:500 13px/1.2 var(--f-mono);letter-spacing:.02em;opacity:.85}
.play{flex:none;width:46px;height:46px;border-radius:50%;background:var(--tile);position:relative}
.play::after{content:"";position:absolute;left:18px;top:13px;border-left:16px solid var(--acc);border-block:10px solid transparent}
.btn-ghost{border:0;background:none;padding:8px 2px;font-size:16px;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:5px}
.btn-ghost:hover{color:var(--acc)}
@media (prefers-reduced-motion:reduce){.btn-hero{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;font:500 12px/1.4 var(--f-mono);color:var(--ink-2)}
.legend b{color:var(--acc);font-weight:600;letter-spacing:.1em}

/* Filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.chip small{font-family:var(--f-mono);color:var(--mute);margin-left:4px;font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--tile)}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--tile);font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn.primary:hover{filter:brightness(1.08)}

/* Grid */
main .wrap{padding-block:22px 60px}
.count{margin:0 0 14px;font:500 12px var(--f-mono);color:var(--ink-2);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tilebtn{display:block;border:0;padding:0;background:none;width:100%}
.tilebtn .t{border-bottom:1px solid var(--line)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 0;font:500 11px/1 var(--f-mono);color:var(--mute)}
.meta .lv{color:var(--acc);letter-spacing:.12em}
.ans{margin:0;padding:6px 10px 11px;min-height:3.1em;font-size:13.5px;line-height:1.3;font-weight:600;color:var(--ink)}
.ans.hid{color:var(--mute);font-weight:500;font-style:italic}
.ans small{display:block;font-weight:400;color:var(--ink-2);font-size:12px;margin-top:3px}

/* ---------- Puzzle tile primitives ---------- */
.t{position:relative;aspect-ratio:1;width:100%;container-type:inline-size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;overflow:hidden;background:var(--tile)}
.w{display:inline-block;font-family:var(--f-puz);font-weight:800;line-height:.92;white-space:nowrap;color:var(--ink);font-size:13cqw}
.a{color:var(--acc)} .m{color:var(--mute)}
.row{display:flex;align-items:center;justify-content:center;gap:2.5cqw}
.tight{gap:0}
.col{display:flex;flex-direction:column;align-items:center;gap:2cqw}
.sv{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.inl{display:block;overflow:visible}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ka{stroke:var(--acc)} .dash{stroke-dasharray:3 4}
.fs{fill:var(--acc-soft)} .fa{fill:var(--acc)} .fw{fill:var(--water);opacity:.82}
.frame{border:1.6cqw solid var(--acc);padding:5cqw 6cqw}
.gbar{position:absolute;height:11%;background:var(--acc-soft);border-left:1.2cqw solid var(--acc);display:flex;align-items:center;padding-left:2.5cqw;border-radius:0 1cqw 1cqw 0}
.fadeout{-webkit-mask-image:linear-gradient(90deg,#000 50%,transparent 90%);mask-image:linear-gradient(90deg,#000 50%,transparent 90%)}
.hr{position:absolute;left:12%;right:12%;height:.8cqw;background:var(--acc)}
.pill{font:600 4.4cqw/1 var(--f-mono);color:var(--acc);border:.6cqw solid var(--acc);border-radius:99px;padding:1.4cqw 3cqw;letter-spacing:.05em}
.box{display:inline-flex;align-items:center;justify-content:center;border:1.2cqw solid var(--acc);border-radius:1cqw}
.speed{display:flex;flex-direction:column;gap:2cqw;align-items:flex-end}
.speed i{display:block;height:1.1cqw;width:12cqw;background:var(--acc);border-radius:1cqw}
.speed i:nth-child(2){width:18cqw}.speed i:nth-child(3){width:8cqw}
.road{display:block;width:78cqw;height:10cqw;background:repeating-linear-gradient(90deg,var(--acc) 0 6cqw,transparent 6cqw 11cqw) center/100% 1cqw no-repeat,var(--ink)}
.tomb{display:flex;flex-direction:column;align-items:center;gap:2.5cqw;border:1.2cqw solid var(--ink);border-radius:30cqw 30cqw 1cqw 1cqw;padding:10cqw 8cqw 9cqw}
.arch{width:64cqw;height:48cqw;border:2.4cqw solid var(--ink);border-bottom:0;border-radius:32cqw 32cqw 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5cqw;background:var(--acc-soft)}
.fence{padding:4.5cqw;background:repeating-linear-gradient(90deg,var(--acc) 0 1.6cqw,transparent 1.6cqw 3.4cqw)}
.fence>div{background:var(--tile);padding:5cqw}
.ul{display:block;width:44cqw;height:.9cqw;background:var(--acc);border-radius:1cqw}
.wallet{position:relative;border:1.4cqw solid var(--acc);border-radius:5cqw;padding:5cqw 17cqw 5cqw 8cqw;background:var(--acc-soft)}
.wallet::after{content:"";position:absolute;right:-1.4cqw;top:50%;transform:translateY(-50%);width:13cqw;height:15cqw;border:1.4cqw solid var(--acc);border-radius:4cqw 0 0 4cqw;background:var(--tile)}
.wallet .col{gap:1.6cqw}
.case{position:relative;border:1.4cqw solid var(--ink);border-radius:3cqw;padding:7cqw 6cqw;background:var(--acc-soft);margin-top:6cqw}
.handle{position:absolute;top:-8.4cqw;left:50%;transform:translateX(-50%);width:20cqw;height:7cqw;border:1.4cqw solid var(--ink);border-bottom:0;border-radius:3cqw 3cqw 0 0}
.ice{background:var(--ice);border-radius:4cqw;padding:10cqw 7cqw;box-shadow:inset 2cqw 2cqw 0 var(--ice-hi),inset -1cqw -1cqw 0 var(--ice-edge)}
.ice .w{color:var(--ice-ink)}
.pipe{position:relative;width:74cqw;height:20cqw;border-block:1.4cqw solid var(--ink);background:var(--acc-soft);display:flex;align-items:center;justify-content:center}
.pipe::before,.pipe::after{content:"";position:absolute;top:-5.4cqw;width:3.4cqw;height:28cqw;background:var(--ink);border-radius:.6cqw}
.pipe::before{left:-3.4cqw}.pipe::after{right:-3.4cqw}
.sheet{position:relative;width:54cqw;height:68cqw;border:1cqw solid var(--ink);display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(transparent 0 7cqw,var(--line) 7cqw 7.5cqw)}
.sheet::after{content:"";position:absolute;top:-1cqw;right:-1cqw;width:13cqw;height:13cqw;background:linear-gradient(225deg,var(--tile) 50%,var(--acc) 50%)}
.sheet .w,.hatch .w,.plate{background:var(--tile);padding:1cqw 2cqw}
.ghost1{color:var(--acc-soft)!important}
.edge{position:absolute;right:0;top:0;bottom:0;width:2cqw;background:var(--acc)}
.gap{display:block;width:26cqw;height:6cqw;border-inline:1cqw solid var(--acc);background:linear-gradient(var(--acc),var(--acc)) center/100% .8cqw no-repeat}
.rail{display:block;width:60cqw;height:4cqw;border-top:1cqw solid var(--ink);background:repeating-linear-gradient(90deg,var(--mute) 0 1.4cqw,transparent 1.4cqw 6cqw)}
.hatch{padding:9cqw 8cqw;border:1cqw dashed var(--acc);background:repeating-linear-gradient(45deg,var(--acc-soft) 0 2cqw,transparent 2cqw 4cqw)}
.vert{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.08em}
.silo{display:flex;align-items:center;justify-content:center;width:17cqw;height:64cqw;border:1cqw solid var(--ink);border-radius:9cqw 9cqw 1cqw 1cqw;background:var(--acc-soft)}
.colm{display:block;width:13cqw;height:70cqw;border:.8cqw solid var(--mute);border-radius:1cqw}
.spirit{display:flex;flex-direction:column;align-items:center;gap:3cqw;padding:10cqw 8cqw 13cqw;background:var(--acc-soft);border-radius:32cqw 32cqw 0 0;clip-path:polygon(0 0,100% 0,100% 100%,83% 91%,67% 100%,50% 91%,33% 100%,17% 91%,0 100%)}
.eyes{font:900 5cqw/1 var(--f-puz);color:var(--ink);letter-spacing:.4em;margin-right:-.4em}
.table{position:absolute;left:50%;top:50%;width:34cqw;height:34cqw;transform:translate(-50%,-50%);border-radius:50%;background:var(--acc-soft);border:1cqw solid var(--acc)}
.cells{display:grid;grid-template-columns:repeat(3,22cqw);grid-template-rows:repeat(3,22cqw);border-top:.8cqw solid var(--ink);border-left:.8cqw solid var(--ink)}
.cells span{border-right:.8cqw solid var(--ink);border-bottom:.8cqw solid var(--ink);display:flex;align-items:center;justify-content:center}
.cells span:nth-child(5){background:var(--acc-soft)}
.narrow{width:30cqw;padding:6cqw 0;border-inline:1.4cqw solid var(--ink);display:flex;justify-content:center}
.plank{display:flex;justify-content:center;width:74cqw;padding:2.5cqw 0;background:var(--wood);border-radius:1cqw}
.onwood{color:var(--wood-ink)!important}
.basket{display:block;width:20cqw;height:11cqw;border:1.1cqw solid var(--acc);border-top:0;border-radius:0 0 9cqw 9cqw}
.weight{display:flex;align-items:center;justify-content:center;width:40cqw;height:18cqw;background:var(--ink);color:var(--tile);font:800 7cqw/1 var(--f-puz);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.arrow{position:relative;display:block;width:34cqw;height:1.6cqw;background:var(--ink);margin-right:5cqw}
.arrow::after{content:"";position:absolute;right:-4.5cqw;top:50%;transform:translateY(-50%);border-left:5cqw solid var(--ink);border-block:3.2cqw solid transparent}
.water{color:var(--water-ink)!important}
.snow{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;border:1cqw solid var(--acc);background:var(--acc-soft)}
.hay{display:grid;grid-template-columns:repeat(4,auto);gap:2.5cqw 4cqw;align-items:center;justify-items:center}
.mono{font-family:var(--f-mono)!important;font-weight:500!important}


/* ---------- Illustrated scenes ---------- */
.scene{position:absolute;inset:0;width:100%;height:100%;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;overflow:hidden}
.xi{fill:var(--ink)}.xa{fill:var(--acc)}.xs{fill:var(--acc-soft)}.xt{fill:var(--tile)}.xh{fill:var(--shade)}.xl{fill:var(--line)}.xm{fill:var(--mute)}
.xw{fill:var(--water)}.xd{fill:var(--wood)}.xdi{fill:var(--wood-ink)}.xc{fill:var(--ice)}.xci{fill:var(--ice-ink)}.xg{fill:var(--ok)}.xr{fill:var(--bad)}.xv{fill:var(--wine)}.n{fill:none}
.si{stroke:var(--ink)}.sa{stroke:var(--acc)}.st{stroke:var(--tile)}.sx{stroke:var(--shade)}.sm{stroke:var(--mute)}.sd{stroke:var(--wood)}.sdi{stroke:var(--wood-ink)}.se{stroke:var(--ice-edge)}.sg{stroke:var(--ok)}.sr{stroke:var(--bad)}
.T{font-family:var(--f-puz);font-weight:800;text-anchor:middle;dominant-baseline:central;stroke:none}

/* ---------- Quiz overlay ---------- */
.quiz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:500 13px var(--f-mono);color:var(--ink-2)}
.qtop .pos{color:var(--ink);font-weight:600}
.qtop .sc{display:flex;gap:10px}
.qtop .sc .ok{color:var(--ok)} .qtop .sc .ko{color:var(--bad)}
.qtop .sp{flex:1}
.timer{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;transition:transform .1s linear}
.timer.off i{background:transparent}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:14px}
.qtile{width:min(62vh,92vw,600px);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qans{min-height:3.2em;text-align:center;font:800 clamp(20px,3.4vw,32px)/1.15 var(--f-puz);text-wrap:balance;max-width:24ch}
.qans small{display:block;font:400 14px/1.4 var(--f-ui);color:var(--ink-2);margin-top:6px}
.qans.hid{color:var(--mute);font:500 15px var(--f-mono)}
.qctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.qctl .btn{padding:10px 16px;font-size:15px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--tile);font-weight:600}
.btn.ko{border-color:var(--bad);color:var(--bad);font-weight:600}
.kbd{font:500 11px var(--f-mono);color:var(--mute);text-align:center;margin:0}
.endc{display:grid;gap:14px;justify-items:center;text-align:center}
.endc .big{font:900 clamp(56px,12vw,120px)/1 var(--f-puz);font-stretch:115%;color:var(--acc)}
.endc p{margin:0;color:var(--ink-2);max-width:44ch}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.miss li{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>
<body>


<header class="hd">
  <div class="wrap">
    <p class="eyebrow">Rébus visuels · gestion de projet &amp; de portefeuille</p>
    <h1>Dingbats du chef <span class="flip">de</span> projet</h1>
    <p class="lede" id="lede">Des expressions du métier cachées dans des jeux de lettres. Touchez un rébus pour voir la réponse, ou lancez le quiz pour l'animer en atelier.</p>
    <div class="cta">
      <button class="btn-hero" id="heroQuiz"><span class="play" aria-hidden="true"></span><span class="lbl">Lancer le quiz<small id="heroSub">113 rébus · chrono 30 s · à projeter</small></span></button>
      <button class="btn-ghost" id="openLib" aria-expanded="false" aria-controls="lib">Parcourir la bibliothèque <span aria-hidden="true">↓</span></button>
    </div>
    <p class="legend"><span><b>●○○</b> facile</span><span><b>●●○</b> moyen</span><span><b>●●●</b> corsé</span></p>
  </div>
</header>

<div id="lib" hidden>
<div class="bar">
  <div class="wrap">
    <div class="chips" id="themes" role="group" aria-label="Thèmes"></div>
    <div class="seg" id="levels" role="group" aria-label="Niveau">
      <button data-lv="0" aria-pressed="true">Tous</button>
      <button data-lv="1" aria-pressed="false">Facile</button>
      <button data-lv="2" aria-pressed="false">Moyen</button>
      <button data-lv="3" aria-pressed="false">Corsé</button>
    </div>
    <div class="actions">
      <button class="btn" id="shuffle">Mélanger</button>
      <button class="btn" id="revealAll" aria-pressed="false">Révéler tout</button>
      <button class="btn primary" id="startQuiz">Lancer le quiz</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </div>
</main>
</div>

<div class="quiz" id="quiz" hidden role="dialog" aria-modal="true" aria-label="Quiz rébus">
  <div class="qtop">
    <span class="pos" id="qpos"></span>
    <span class="sc"><span class="ok" id="qok">✓ 0</span><span class="ko" id="qko">✗ 0</span></span>
    <span class="sp"></span>
    <button class="btn" id="qtimerBtn" aria-pressed="true">Chrono 30 s</button>
    <button class="btn" id="qfs">Plein écran</button>
    <button class="btn" id="qclose">Fermer</button>
  </div>
  <div class="timer" id="qtimer"><i id="qbar"></i></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- helpers ---------- */
const w=(t,s='',c='')=>`<span class="w ${c}" style="${s}">${t}</span>`;
const a=(t,s='',c='')=>w(t,s,'a '+c);
const m=(t,s='',c='')=>w(t,s,'m '+c);
const at=(x,y,tr='')=>`position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%) ${tr};`;
const f=n=>`font-size:${n}cqw;`;
const L=(word,sf,cf=()=>'')=>[...word].map((ch,i,arr)=>`<span class="w ${cf(i,arr.length)}" style="${sf(i,arr.length)}">${ch}</span>`).join('');
const row=(...x)=>`<div class="row">${x.join('')}</div>`;
const tight=(...x)=>`<div class="row tight">${x.join('')}</div>`;
const col=(...x)=>`<div class="col">${x.join('')}</div>`;
const sv=(inner)=>`<svg class="sv" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${inner}</svg>`;
const wave=`<svg class="inl" viewBox="0 0 100 16" style="width:62cqw;height:10cqw" aria-hidden="true"><path class="k ka" d="M2 8 Q8.5 0 15 8 T28 8 T41 8 T54 8 T67 8 T80 8 T93 8"/></svg>`;
const circ=(word,r,size,cf)=>L(word,(i,n)=>{const t=-Math.PI/2+i*2*Math.PI/n;return at((50+r*Math.cos(t)).toFixed(2),(50+r*Math.sin(t)).toFixed(2),`rotate(${((t+Math.PI/2)*180/Math.PI).toFixed(1)}deg)`)+f(size)},cf);

const R=[];
const p=(th,lv,ans,r,note='')=>R.push({th,lv,ans,r,note});

/* ---------- CYCLE DE PROJET ---------- */
p('cycle',1,"Rétroplanning", col(w('GNINNALP',f(13.5)),a('←',f(9))), "PLANNING écrit à rebours.");
p('cycle',1,"Cycle en V", L('CYCLE',i=>at([16,33,50,67,84][i],[24,47,72,47,24][i])+f(15),i=>i==2?'a':''), "Les lettres de CYCLE dessinent un V.");
p('cycle',1,"Phase de cadrage", `<div class="frame">${w('PHASE',f(14))}</div>`, "PHASE posée dans un cadre.");
p('cycle',2,"Diagramme de Gantt", [...'GANTT'].map((ch,i)=>`<div class="gbar" style="left:${7+i*12}%;top:${12+i*15.5}%;width:${[30,40,26,36,30][i]}%">${w(ch,f(8.5))}</div>`).join(''), "G-A-N-T-T sur des barres de planning décalées.");
p('cycle',1,"Livraison continue", w('LIVRAISON LIVRAISON LIVRAISON','position:absolute;left:9%;top:50%;transform:translateY(-50%);'+f(10.5),'fadeout'), "LIVRAISON se répète sans s'arrêter.");
p('cycle',1,"Ligne de base (baseline)", w('LIGNE',at(50,80)+f(14))+`<div class="hr" style="top:90%"></div>`, "LIGNE posée tout en bas.");
p('cycle',2,"Kick-off", col(m('KICK',f(20)),`<span class="pill">● OFF</span>`), "KICK est éteint : il est « off ».");
p('cycle',1,"Go / No go", row(a('GO',f(17)),m('/',f(13)),w('GO',f(17)+'text-decoration:line-through;text-decoration-thickness:1.3cqw;text-decoration-color:var(--acc)','m')), "Un GO validé, un GO barré.");
p('cycle',3,"Mise en prod", tight(w('PR',f(15)),a('MISE',f(15)),w('OD',f(15))), "MISE se trouve en (dans) PROD.");
p('cycle',1,"Point d'étape", tight(w('ÉTAPE',f(15)),a('●',f(7)+'align-self:flex-end;margin:0 0 .4cqw 1.5cqw')), "ÉTAPE suivie d'un gros point.");
p('cycle',2,"Jalon décalé", tight(w('JA',f(18)),a('LON',f(18)+'transform:translate(2cqw,10cqw)')), "La fin de JALON a glissé.");
p('cycle',2,"Dérive du périmètre (scope creep)", `<span class="box" style="position:absolute;left:8%;top:30%;width:60%;height:36%"></span>`+w('PÉRIMÈ',at(38,48)+f(10))+a('T',at(73,58,'rotate(16deg)')+f(10))+a('R',at(83,70,'rotate(34deg)')+f(10))+a('E',at(91,84,'rotate(58deg)')+f(10)), "Les dernières lettres de PÉRIMÈTRE sortent du cadre.");
p('cycle',1,"Sprint", row(`<span class="speed"><i></i><i></i><i></i></span>`,w('SPRINT',f(14)+'transform:skewX(-14deg)')), "SPRINT lancé à pleine vitesse.");
p('cycle',2,"Backlog", w('GOL',f(26)), "LOG lu à l'envers : back + log.");
p('cycle',2,"Roadmap", col(w('MAP',f(19)),`<span class="road"></span>`), "MAP posé sur une route.");
p('cycle',2,"Deadline", `<div class="tomb">${m('R.I.P.',f(5))}${w('LINE',f(13))}</div>`, "LINE gravée sur une pierre tombale.");
p('cycle',2,"Dérapage du planning", tight(L('PLANNING',i=>f(11)+`transform:translateY(${(i*i*0.32).toFixed(1)}cqw) rotate(${i*6}deg)`,i=>i>3?'a':'')), "PLANNING qui part dans le décor.");
p('cycle',2,"Retard de livraison", tight(w('LIVRAISO',f(10.5)),m('···',f(10.5)+'margin-inline:2cqw'),a('N',f(10.5))), "Le N de LIVRAISON arrive en retard.");
p('cycle',1,"Effet tunnel", `<div class="arch">${w('PROJET',f(10))}</div>`, "PROJET au fond d'un tunnel.");
p('cycle',2,"Clôture du projet", `<div class="fence"><div>${w('PROJET',f(11))}</div></div>`, "PROJET entouré d'une clôture.");
p('cycle',1,"Planning serré", row(a('→',f(10)),w('PLANNING',f(12.5)+'letter-spacing:-.16em'),a('←',f(10))), "Les lettres de PLANNING sont serrées.");
p('cycle',1,"Lancement du projet", sv(`<path class="k ka dash" d="M8 94 Q 22 78 40 64"/>`)+w('PROJET',at(60,44,'rotate(-38deg)')+f(13)), "PROJET qui décolle.");
p('cycle',1,"Tâches en parallèle", col(w('TÂCHE',f(13)),`<span class="ul"></span>`,w('TÂCHE',f(13)),`<span class="ul"></span>`), "Deux TÂCHES sur deux lignes parallèles.");

/* ---------- PORTEFEUILLE / PPM ---------- */
p('ppm',1,"Portefeuille de projets", `<div class="wallet">${col(w('PROJET',f(6.5)),w('PROJET',f(6.5)),w('PROJET',f(6.5)))}</div>`, "Des PROJETS rangés dans un portefeuille.");
p('ppm',1,"Coupe budgétaire", w('BUD',at(32,42,'rotate(-7deg)')+f(16))+w('GET',at(68,60,'rotate(6deg)')+f(16))+sv(`<line class="k ka dash" x1="47" y1="16" x2="53" y2="90"/>`)+a('✂︎',at(47,10)+f(8)), "BUDGET coupé en deux.");
p('ppm',1,"Dépassement de budget", `<span class="box" style="width:46cqw;height:22cqw">${w('BUDGET',f(16))}</span>`, "BUDGET déborde de son cadre.");
p('ppm',1,"Enveloppe budgétaire", sv(`<rect class="k ka" x="12" y="24" width="76" height="52" rx="2"/><path class="k ka" d="M12 25 L50 52 L88 25"/>`)+w('BUDGET',at(50,65)+f(8.5)), "BUDGET dans une enveloppe.");
p('ppm',2,"Retour sur investissement (ROI)", col(a('RETOUR',f(10)),w('INVESTISSEMENT',f(6.4))), "RETOUR posé sur INVESTISSEMENT.");
p('ppm',2,"Business case", `<div class="case"><span class="handle"></span>${w('BUSINESS',f(9))}</div>`, "BUSINESS dans une mallette (case).");
p('ppm',2,"Quick win", col(w('WIN',f(21)),`<span class="pill">00:00:01</span>`), "Un WIN obtenu en une seconde.");
p('ppm',1,"Shadow IT", w('IT',f(30)+'text-shadow:3.5cqw 3cqw 0 var(--shade)'), "IT et son ombre.");
p('ppm',1,"Big picture (vue d'ensemble)", w('PICTURE',f(18)), "PICTURE en très grand.");
p('ppm',2,"Low-hanging fruit", sv(`<path class="k" style="stroke-width:3" d="M2 14 Q 50 4 98 16"/><line class="k" x1="50" y1="10" x2="50" y2="72"/>`)+a('FRUIT',at(50,82)+f(12)), "FRUIT qui pend très bas : un gain facile.");
p('ppm',2,"Sunk cost (coût irrécupérable)", w('COST',at(50,58)+f(20))+sv(`<path class="fw" d="M0 55 Q12.5 49 25 55 T50 55 T75 55 T100 55 V100 H0Z"/>`), "COST qui coule sous l'eau.");
p('ppm',1,"Valeur ajoutée", row(w('VALEUR',f(14)),a('+',f(20))), "VALEUR + quelque chose.");
p('ppm',1,"Projets gelés", `<div class="ice">${w('PROJETS',f(10))}</div>`, "PROJETS pris dans la glace.");
p('ppm',2,"Pipeline de projets", `<div class="pipe">${w('PROJETS',f(9))}</div>`, "PROJETS dans un tuyau (pipeline).");
p('ppm',1,"Feuille de route", `<div class="sheet">${w('ROUTE',f(11))}</div>`, "ROUTE écrite sur une feuille.");
p('ppm',1,"Priorité n°1", a('1',at(50,50)+f(78),'ghost1')+w('PRIORITÉ',at(50,52)+f(12)), "PRIORITÉ posée sur un énorme 1.");
p('ppm',2,"Portefeuille équilibré", w('PORTEFEUILLE',at(50,47)+f(7.4))+sv(`<line class="k" style="stroke-width:2.5" x1="8" y1="55" x2="92" y2="55"/><path class="fa" d="M50 56 L40 76 H60Z"/>`), "PORTEFEUILLE en équilibre sur une balance.");
p('ppm',2,"Cash flow", tight(L('CASH',i=>f(16)+`transform:translateY(${(Math.sin(i*1.5)*6).toFixed(1)}cqw)`))+sv(`<path class="k ka" d="M6 80 Q15 74 24 80 T42 80 T60 80 T78 80 T96 80"/>`), "CASH qui s'écoule en vagues (flow).");
p('ppm',2,"Budget parti en fumée", tight(L('BUDGET',i=>f(12.5)+`transform:translateY(${-i*3.2}cqw);opacity:${(1-i*0.15).toFixed(2)};filter:blur(${(i*0.22).toFixed(2)}cqw)`)), "BUDGET qui s'évapore.");
p('ppm',1,"Long terme", w('TERME',f(9)+'letter-spacing:.9em;margin-right:-.9em'), "TERME très étiré, donc long.");
p('ppm',3,"Dette technique", row(a('−',f(18)),w('TECHNIQUE',f(9.5))), "TECHNIQUE dans le négatif.");
p('ppm',2,"Projet phare", sv(`<path class="fs" d="M50 50 L0 18 V44Z M50 50 L100 18 V44Z"/>`)+a('●',at(50,48)+f(6))+w('PROJET',at(50,64)+f(12)), "PROJET qui éclaire comme un phare.");
p('ppm',2,"Fusion de projets", w('PROJET',at(44,44)+f(14))+a('PROJET',at(56,56)+f(14)+'opacity:.85'), "Deux PROJETS qui se superposent.");
p('ppm',3,"Économies d'échelle", sv(`<g class="k"><line x1="26" y1="4" x2="26" y2="96"/><line x1="74" y1="4" x2="74" y2="96"/><line x1="26" y1="18" x2="74" y2="18"/><line x1="26" y1="34" x2="74" y2="34"/><line x1="26" y1="66" x2="74" y2="66"/><line x1="26" y1="82" x2="74" y2="82"/></g>`)+a('ÉCONOMIES',at(50,50)+f(8.5),'plate'), "ÉCONOMIES sur les barreaux d'une échelle.");

/* ---------- PILOTAGE & REPORTING ---------- */
p('pilot',1,"Tableau de bord", w('TABLEAU',at(88,50,'rotate(90deg)')+f(10))+`<span class="edge"></span>`, "TABLEAU collé au bord.");
p('pilot',1,"Feu vert", w('FEU',f(26)+'color:var(--ok)'), "FEU en vert.");
p('pilot',1,"Indicateur au rouge", w('INDICATEUR',f(9)+'color:var(--bad)'), "INDICATEUR en rouge.");
p('pilot',2,"Écart prévu / réel", row(w('PRÉVU',f(8)),`<span class="gap"></span>`,w('RÉEL',f(8))), "Un écart mesuré entre PRÉVU et RÉEL.");
p('pilot',1,"Courbe en S", L('COURBE',i=>at([70,48,38,56,62,40][i],[16,22,38,54,72,84][i])+f(13),i=>i%2?'a':''), "COURBE qui dessine un S.");
p('pilot',2,"Tout est sous contrôle", col(w('CONTRÔLE',f(12)),a('TOUT',f(12))), "TOUT placé sous CONTRÔLE.");
p('pilot',3,"Budget dans les clous", col(a('TTTTT',f(9)+'letter-spacing:.55em;margin-right:-.55em'),w('BUDGET',f(14)),a('TTTTT',f(9)+'letter-spacing:.55em;margin-right:-.55em;transform:rotate(180deg)')), "BUDGET entre deux rangées de clous.");
p('pilot',2,"On track", col(a('ON',f(14)),w('TRACK',f(15)),`<span class="rail"></span>`), "ON posé sur TRACK.");
p('pilot',1,"Signaux faibles", w('signaux',f(5)+'font-weight:400;opacity:.32'), "SIGNAUX à peine visibles.");
p('pilot',1,"Risque majeur", w('RISQUE',f(22)+'font-weight:900'), "RISQUE en majuscules géantes.");
p('pilot',1,"Remontée d'information", col(a('↑',f(10)),w('INFO',f(14)),w('INFO',f(10)+'opacity:.55'),w('INFO',f(7)+'opacity:.28')), "INFO qui monte.");
p('pilot',2,"Escalade", sv(`<path class="k" d="M4 94 H16 V84 H26 V74.5 H36.5 V65 H47 V55.5 H57.5 V46 H68 V36.5 H78.5 V27 H96"/>`)+L('PROBLÈME',i=>at([10,21,31.2,41.8,52.2,62.8,73.2,87][i],[94,84,74.5,65,55.5,46,36.5,27][i]-6.5)+f(9),i=>i==7?'a':''), "PROBLÈME qui grimpe les marches.");
p('pilot',1,"Météo projet", col(row(a('☀︎',f(11)),m('☁︎',f(11)),a('☂︎',f(11))),w('PROJET',f(14))), "PROJET sous la météo.");
p('pilot',1,"Tendance à la hausse", w('TENDANCE',f(11)+'transform:rotate(-24deg)')+a('↗',at(84,20)+f(12)), "TENDANCE qui monte.");
p('pilot',3,"Ressources sous tension", col(`<svg class="inl" viewBox="0 0 100 20" style="width:66cqw;height:12cqw" aria-hidden="true"><path class="k ka" d="M2 10 L14 2 L26 18 L38 2 L50 18 L62 2 L74 18 L86 2 L98 10"/></svg>`,w('RESSOURCES',f(8.5))), "RESSOURCES sous une ligne haute tension.");
p('pilot',2,"Angle mort", sv(`<path class="k" style="stroke-width:3" d="M18 18 V82 H82"/><path class="k ka" d="M18 56 A26 26 0 0 0 44 82"/>`)+w('MORT',at(56,56)+f(12)), "MORT logé dans un angle.");
p('pilot',1,"Zone de risque", `<div class="hatch">${w('RISQUE',f(12))}</div>`, "RISQUE dans une zone hachurée.");
p('pilot',2,"Pic de charge", sv(`<path class="fs" d="M2 96 L30 60 L50 34 L70 60 L98 96Z"/>`)+w('CHARGE',at(50,24)+f(10)), "CHARGE au sommet d'un pic.");

/* ---------- ÉQUIPE & GOUVERNANCE ---------- */
p('team',1,"Chef de projet", col(a('♛︎',f(14)),w('PROJET',f(14))), "PROJET couronné.");
p('team',1,"Top management", w('MANAGEMENT',at(50,11)+f(8.4)), "MANAGEMENT tout en haut.");
p('team',1,"Travail en silos", row(...[0,1,2].map(()=>`<span class="silo">${w('ÉQUIPE',f(5.5),'vert')}</span>`)), "Chaque ÉQUIPE dans son silo.");
p('team',2,"Équipe transverse", `<div class="row" style="gap:10cqw">${'<span class="colm"></span>'.repeat(3)}</div>`+a('ÉQUIPE',at(50,50)+f(14),'plate'), "ÉQUIPE qui traverse les colonnes.");
p('team',1,"Stand-up meeting", w('MEETING',f(9.5),'vert'), "MEETING debout.");
p('team',2,"One-to-one", row(w('ONE',f(14)),a('2',f(19)),w('ONE',f(14))), "ONE 2 (to) ONE.");
p('team',2,"Feedback", row(w('FEED',f(16)),a('↩',f(16))), "FEED avec un retour (back).");
p('team',1,"Montée en compétences", `<div class="row tight" style="align-items:flex-end">${L('COMPÉTENCES',i=>f((4+i*1.05).toFixed(2)))}</div>`, "COMPÉTENCES qui grandissent.");
p('team',2,"Brainstorming", col(row(m('☁︎',f(13)),a('ϟ',f(14))),w('BRAIN',f(17))), "Un orage (storm) au-dessus de BRAIN.");
p('team',2,"Résistance au changement", row(a('→',f(12)),tight(L('CHANGEMENT',i=>f(7.4)+`transform:skewX(${12+i*1.2}deg)`))), "CHANGEMENT qui s'arc-boute contre la poussée.");
p('team',1,"Surcharge de travail", `<div class="col" style="gap:.5cqw">${[-4,5,-2,6,-3].map((r,i)=>w('TRAVAIL',f(9)+`transform:rotate(${r}deg) translateX(${i%2?3:-3}cqw)`)).join('')}</div>`, "Une pile de TRAVAIL.");
p('team',3,"Top-down", w('TOP',f(26)+'transform:rotate(180deg)'), "TOP la tête en bas.");
p('team',3,"Bottleneck (goulot d'étranglement)", sv(`<path class="k" style="stroke-width:2.5" d="M38 6 H62 V30 Q82 38 82 56 V94 H18 V56 Q18 38 38 30 Z"/>`)+a('NECK',at(50,18,'scaleX(.42)')+f(9))+m('FLUX',at(50,70)+f(12)), "NECK coincé dans le col d'une bouteille.");
p('team',2,"Esprit d'équipe", `<div class="spirit"><span class="eyes">● ●</span>${w('ÉQUIPE',f(10))}</div>`, "ÉQUIPE en fantôme (esprit).");
p('team',2,"Tour de table", `<span class="table"></span>`+circ('TABLE',36,12,()=>''), "TABLE qui fait le tour d'une table.");
p('team',2,"Ordre du jour", row(...[...'JOUR'].map((c,i)=>`<span class="col" style="gap:2cqw">${w(c,f(16))}${a(String(i+1),f(6),'mono')}</span>`)), "JOUR numéroté dans l'ordre.");
p('team',2,"Cellule de crise", `<div class="cells">${Array.from({length:9},(_,i)=>`<span>${i==4?a('CRISE',f(5.5)):''}</span>`).join('')}</div>`, "CRISE enfermée dans une cellule.");
p('team',2,"Comité restreint", `<div class="narrow">${w('COMITÉ',f(12)+'letter-spacing:-.17em')}</div>`, "COMITÉ à l'étroit.");

/* ---------- EXPRESSIONS ---------- */
p('expr',1,"Avoir du pain sur la planche", col(w('PAIN',f(17)),`<span class="plank">${w('PLANCHE',f(6.5),'onwood')}</span>`), "PAIN sur PLANCHE.");
p('expr',3,"Mettre la charrue avant les bœufs", row(w('CHARRUE',f(8.6)),a('·',f(8)),w('BŒUFS',f(8.6))), "CHARRUE placée avant BŒUFS.");
p('expr',1,"Think outside the box", `<span class="box" style="position:absolute;left:12%;top:40%;width:46%;height:46%"></span>`+w('THINK',at(70,22)+f(13)), "THINK hors de la boîte.");
p('expr',2,"Ne pas mettre tous ses œufs dans le même panier", row(...[0,1,2].map(()=>`<span class="col" style="gap:1cqw">${w('ŒUF',f(6.5))}<span class="basket"></span></span>`)), "Un ŒUF par panier.");
p('expr',3,"Avoir le nez dans le guidon", tight(w('GUI',f(14)),a('NEZ',f(14)),w('DON',f(14))), "NEZ dans GUIDON.");
p('expr',1,"Couper la poire en deux", row(w('POI',f(18)+'transform:rotate(-8deg)'),a('RE',f(18)+'transform:translateY(5cqw) rotate(9deg)')), "POIRE coupée en deux.");
p('expr',1,"Retour à la case départ", `<span class="box" style="padding:7cqw 6cqw">${w('DÉPART',f(11))}</span>`+a('↺',at(80,20)+f(14)), "DÉPART dans une case, avec un retour.");
p('expr',2,"Prendre du recul", col(w('RECUL',f(6)+'opacity:.3'),w('RECUL',f(10)+'opacity:.6'),w('RECUL',f(16))), "RECUL qui s'éloigne.");
p('expr',2,"Être sur la même longueur d'onde", col(...[0,1].map(i=>`<span class="col" style="gap:1cqw">${w('ONDE',f(8),i?'a':'')}${wave}</span>`)), "Deux ONDES de même longueur.");
p('expr',1,"Mettre les bouchées doubles", row(w('BOUCHÉES',f(11)),a('×2',f(11))), "BOUCHÉES fois deux.");
p('expr',1,"Avancer à petits pas", row(w('pas pas pas pas',f(5)+'font-weight:500'),a('→',f(6))), "De tout petits PAS vers l'avant.");

ov("Phase de cadrage",S(`<path class="n si" stroke-width="1.4" d="M60 40 L100 16 L140 40"/><circle class="xi" cx="100" cy="15" r="3"/>
 <rect class="xa si" x="20" y="38" width="160" height="134" rx="2"/><rect class="xs si" stroke-width="1" x="30" y="48" width="140" height="114"/><rect class="xt si" stroke-width="1" x="38" y="56" width="124" height="98"/>
 <circle class="xt" cx="25" cy="43" r="3"/><circle class="xt" cx="175" cy="43" r="3"/><circle class="xt" cx="25" cy="167" r="3"/><circle class="xt" cx="175" cy="167" r="3"/>
 ${T(100,105,32,'PHASE')}`),"PHASE posée dans un cadre.");

ov("Cash flow",S((()=>{let s=`<path class="xw" opacity=".5" d="M-2 110 Q23 100 48 110 T98 110 T148 110 T198 110 V204 H-2Z"/><path class="xw" opacity=".6" d="M-2 150 Q23 140 48 150 T98 150 T148 150 T198 150 V204 H-2Z"/>`;
 [[34,104,-12,'C'],[78,118,8,'A'],[122,102,-6,'S'],[166,120,10,'H']].forEach(([x,y,a,l])=>{s+=`<g transform="translate(${x} ${y}) rotate(${a})"><rect class="xs si" x="-20" y="-13" width="40" height="26" rx="2"/><rect class="n sa" stroke-width="1" x="-16" y="-9" width="32" height="18"/>${T(0,.5,17,l)}</g>`;});
 s+=`<path class="n sa" stroke-width="2.4" d="M60 60 H140 M130 52 L140 60 L130 68"/>`;return s;})()),"Les billets C-A-S-H emportés par le courant (flow).");

 return `<g transform="translate(88 104) rotate(-8) scale(1.2)"><path class="n si" stroke-width="3" d="M0 -48 Q2 -58 8 -64"/><ellipse class="xa si" stroke-width="1.2" cx="14" cy="-58" rx="8" ry="4" transform="rotate(-20 14 -58)"/><path class="xs si" d="${half}"/><ellipse class="xi" cx="-6" cy="14" rx="2.4" ry="4"/>${T(-20,26,16,'POI')}</g>
 <g transform="translate(114 116) rotate(10) scale(1.2)"><g transform="scale(-1 1)"><path class="xs si" d="${half}"/></g><ellipse class="xi" cx="6" cy="14" rx="2.4" ry="4"/>${T(20,26,17,'RE')}</g>

/* ---------- App ---------- */
const TH={all:'Tous',cycle:'Cycle de projet',ppm:'Portefeuille',pilot:'Pilotage & reporting',team:'Équipe & gouvernance',expr:'Expressions'};
const code=i=>'R-'+String(i+1).padStart(3,'0');
const dots=lv=>'●'.repeat(lv)+'○'.repeat(3-lv);
let order=R.map((_,i)=>i), fTh='all', fLv=0, revealAll=false;
const opened=new Set();
const $=id=>document.getElementById(id);

document.getElementById('lede').textContent=`${R.length} expressions du métier cachées dans des jeux de lettres. Lancez le quiz pour l'animer en atelier, ou parcourez la bibliothèque pour voir chaque réponse.`;
document.getElementById('heroSub').textContent=`${R.length} rébus · chrono 30 s · à projeter`;

function visible(){return order.filter(i=>(fTh==='all'||R[i].th===fTh)&&(!fLv||R[i].lv===fLv));}
function renderThemes(){
  $('themes').innerHTML=Object.keys(TH).map(k=>{
    const n=R.filter(x=>(k==='all'||x.th===k)&&(!fLv||x.lv===fLv)).length;
    return `<button class="chip" data-th="${k}" aria-pressed="${k===fTh}">${TH[k]}<small>${n}</small></button>`}).join('');
}
function ansHTML(i,show){const x=R[i];return show?`${x.ans}${x.note?`<small>${x.note}</small>`:''}`:'Touchez pour révéler';}
function renderGrid(){
  const v=visible();
  $('count').textContent=`${v.length} rébus affiché${v.length>1?'s':''}`;
  $('grid').innerHTML=v.length?v.map(i=>{const x=R[i],show=revealAll||opened.has(i);
    return `<article class="card"><button class="tilebtn" data-i="${i}" aria-expanded="${show}" aria-label="Rébus ${code(i)} : ${show?'masquer':'révéler'} la réponse"><div class="t">${x.r}</div></button>
    <div class="meta"><span>${code(i)}</span><span>${TH[x.th]}</span><span class="lv" title="Niveau ${x.lv}">${dots(x.lv)}</span></div>
    <p class="ans ${show?'':'hid'}">${ansHTML(i,show)}</p></article>`}).join(''):`<p>Aucun rébus pour ce filtre.</p>`;
}
function render(){renderThemes();renderGrid();}

$('themes').addEventListener('click',e=>{const b=e.target.closest('[data-th]');if(!b)return;fTh=b.dataset.th;render();});
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(!b)return;fLv=+b.dataset.lv;
  [...$('levels').children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tilebtn');if(!b)return;const i=+b.dataset.i;
  opened.has(i)?opened.delete(i):opened.add(i);
  const show=revealAll||opened.has(i);const card=b.closest('.card');const an=card.querySelector('.ans');
  an.className='ans '+(show?'':'hid');an.innerHTML=ansHTML(i,show);
  b.setAttribute('aria-expanded',show);b.setAttribute('aria-label',`Rébus ${code(i)} : ${show?'masquer':'révéler'} la réponse`);});
$('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}renderGrid();});
$('revealAll').addEventListener('click',e=>{revealAll=!revealAll;if(!revealAll)opened.clear();e.currentTarget.setAttribute('aria-pressed',revealAll);e.currentTarget.textContent=revealAll?'Masquer tout':'Révéler tout';renderGrid();});

/* ---------- Quiz ---------- */
const DUR=30000;
let Q=[],qi=0,res=[],revealed=false,timerOn=true,t0=0,tick=null,ended=false;
function qStart(){
  Q=visible();if(!Q.length)return;qi=0;res=new Array(Q.length).fill(null);ended=false;
  $('quiz').hidden=false;document.documentElement.style.overflow='hidden';qShow();
}
function qClose(){stopT();$('quiz').hidden=true;document.documentElement.style.overflow='';
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});} }
function scores(){$('qok').textContent='✓ '+res.filter(x=>x===true).length;$('qko').textContent='✗ '+res.filter(x=>x===false).length;}
function stopT(){clearInterval(tick);tick=null;}
function startT(){stopT();const bar=$('qbar');if(!timerOn||revealed){bar.style.transform='scaleX(1)';return;}
  t0=Date.now();bar.style.transform='scaleX(1)';
  tick=setInterval(()=>{const r=Math.max(0,1-(Date.now()-t0)/DUR);bar.style.transform=`scaleX(${r})`;if(r<=0){stopT();qReveal();}},100);}
function qShow(){
  ended=false;const i=Q[qi],x=R[i];revealed=res[qi]!==null;
  $('qpos').textContent=`Rébus ${qi+1} / ${Q.length} · ${code(i)} · ${dots(x.lv)}`;scores();
  $('qtimer').classList.toggle('off',!timerOn);
  $('stage').innerHTML=`<div class="qtile"><div class="t">${x.r}</div></div>
   <div class="qans ${revealed?'':'hid'}" id="qans">${revealed?`${x.ans}<small>${x.note}</small>`:`${TH[x.th]}`}</div>
   <div class="qctl" id="qctl"></div><p class="kbd">Espace : révéler · ← → : naviguer · Échap : fermer</p>`;
  qCtl();startT();
}
function qCtl(){
  const done=res[qi]!==null;
  $('qctl').innerHTML=`<button class="btn" data-q="prev" ${qi===0?'disabled':''}>← Précédent</button>`+
    (!revealed?`<button class="btn primary" data-q="reveal">Révéler la réponse</button>`:
     done?`<button class="btn primary" data-q="next">${qi===Q.length-1?'Voir le score':'Suivant →'}</button>`:
     `<button class="btn ok" data-q="yes">Trouvé</button><button class="btn ko" data-q="no">Pas trouvé</button>`)+
    (!revealed?`<button class="btn" data-q="next">Passer →</button>`:'');
}
function qReveal(){if(revealed)return;revealed=true;stopT();const x=R[Q[qi]];
  const el=$('qans');el.className='qans';el.innerHTML=`${x.ans}<small>${x.note}</small>`;qCtl();}
function qNext(){if(qi<Q.length-1){qi++;qShow();}else qEnd();}
function qPrev(){if(qi>0){qi--;qShow();}}
function qJudge(v){res[qi]=v;scores();qNext();}
function qEnd(){
  stopT();ended=true;const ok=res.filter(x=>x===true).length;
  const miss=Q.filter((_,k)=>res[k]!==true);
  $('qpos').textContent='Fin du quiz';$('qbar').style.transform='scaleX(0)';
  $('stage').innerHTML=`<div class="endc"><div class="big">${ok} / ${Q.length}</div>
   <p>${ok===Q.length?'Sans faute. L\'équipe parle couramment le projet.':'Rébus trouvés par la salle. Voici ceux qui ont résisté :'}</p>
   ${miss.length?`<ul class="miss">${miss.map(i=>`<li>${R[i].ans}</li>`).join('')}</ul>`:''}
   <div class="qctl"><button class="btn primary" data-q="restart">Rejouer en mélangeant</button><button class="btn" data-q="close">Retour à la bibliothèque</button></div></div>`;
}
$('quiz').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;
  ({prev:qPrev,next:qNext,reveal:qReveal,yes:()=>qJudge(true),no:()=>qJudge(false),close:qClose,
    restart:()=>{for(let i=Q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[Q[i],Q[j]]=[Q[j],Q[i]];}qi=0;res=new Array(Q.length).fill(null);qShow();}})[b.dataset.q]();});
$('startQuiz').addEventListener('click',qStart);
$('heroQuiz').addEventListener('click',qStart);
$('openLib').addEventListener('click',e=>{const lib=$('lib'),b=e.currentTarget;lib.hidden=!lib.hidden;b.setAttribute('aria-expanded',!lib.hidden);
  b.innerHTML=lib.hidden?'Parcourir la bibliothèque <span aria-hidden="true">↓</span>':'Masquer la bibliothèque <span aria-hidden="true">↑</span>';
  if(!lib.hidden)lib.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
$('qclose').addEventListener('click',qClose);
$('qtimerBtn').addEventListener('click',e=>{timerOn=!timerOn;e.currentTarget.setAttribute('aria-pressed',timerOn);
  e.currentTarget.textContent=timerOn?'Chrono 30 s':'Chrono coupé';$('qtimer').classList.toggle('off',!timerOn);if(!ended)startT();});
$('qfs').addEventListener('click',()=>{const el=$('quiz');
  try{const pr=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.();pr&&pr.catch&&pr.catch(()=>{});}catch(_){}});
document.addEventListener('keydown',e=>{if($('quiz').hidden)return;
  if(e.key==='Escape'){qClose();return;}
  if(ended)return;
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();revealed?(res[qi]!==null?qNext():null):qReveal();}
  else if(e.key==='ArrowRight'){qNext();}
  else if(e.key==='ArrowLeft'){qPrev();}});

render();
</script>
